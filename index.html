<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="全球要闻">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>全球要闻</title>
<style>
:root{
  --bg:#f5f5f6;
  --card:#ffffff;
  --text:#111111;
  --text2:#3d3d3d;
  --text3:#9a9a9a;
  --line:#ececec;
  --red:#ff3b30;
  --red-dark:#e02a20;
  --hero:#0a0a0a;
  --hero-sub:#8f8f8f;
  --hero-btn-bg:#151515;
  --hero-btn-line:#333333;
  --hero-btn-text:#ededed;
  --pill:#ffffff;
  --pill-line:#e6e6e6;
  --pill-text:#333333;
  --pill-num:#8a8a8a;
  --active:#111111;
  --active-text:#ffffff;
  --impact:#f2f2f2;
  --green:#18c964;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --nav:#ffffff;
}
[data-theme="dark"]{
  --bg:#0f1115;
  --card:#181b21;
  --text:#f2f4f7;
  --text2:#c2c8d0;
  --text3:#7d848e;
  --line:#252a32;
  --red:#ff453a;
  --red-dark:#ff5b50;
  --hero:#000000;
  --hero-sub:#8b9098;
  --hero-btn-bg:#141414;
  --hero-btn-line:#3a3a3a;
  --hero-btn-text:#e8e8e8;
  --pill:#1b1f26;
  --pill-line:#2b313a;
  --pill-text:#d5dae2;
  --pill-num:#7f8792;
  --active:#f2f4f7;
  --active-text:#111111;
  --impact:#232830;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --nav:#181b21;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#e8e8ec;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
[data-theme="dark"] body{background:#000}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
@media (max-width:520px){#app{max-width:none}}
button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer}

/* ---------- 顶部栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:4px;
  padding:0 10px;
  padding-top:env(safe-area-inset-top);
  height:calc(52px + env(safe-area-inset-top));
  background:var(--nav);
  border-bottom:1px solid var(--line);
}
.icon-btn{
  width:32px;height:32px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.icon-btn svg{width:21px;height:21px;display:block}
.icon-btn:active{opacity:.5}
.channel{
  display:flex;align-items:center;gap:2px;
  font-size:16px;font-weight:700;letter-spacing:.2px;
  padding:4px 2px;
}
.channel svg{width:15px;height:15px;margin-top:2px;color:var(--text3)}
.spacer{flex:1 1 auto}
.tools{display:flex;align-items:center;gap:0}
.avatar{
  width:26px;height:26px;border-radius:50%;
  background:#ffd200;color:#1a1a1a;
  font-size:10px;font-weight:800;letter-spacing:-.3px;
  display:flex;align-items:center;justify-content:center;
  margin-right:6px;flex:0 0 auto;
}
.bell{position:relative}
.bell .dot{
  position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;
  background:#ff3b30;border:1px solid var(--nav);
}

/* ---------- 深色头图 ---------- */
.hero{background:var(--hero);color:#fff;padding:16px 16px 15px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{margin:0;font-size:34px;font-weight:800;line-height:1.15;letter-spacing:.5px;color:#fff}
.brand em{font-style:normal;color:var(--red)}
.hdate{margin-top:6px;text-align:right;font-size:13px;line-height:1.55;color:var(--hero-sub);white-space:nowrap}
.hero-row{margin-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.upd{display:flex;align-items:center;gap:7px;font-size:13px;color:#a5a5a5;min-width:0}
.upd i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto;box-shadow:0 0 0 3px rgba(24,201,100,.12)}
.btn-refresh{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  background:var(--hero-btn-bg);border:1px solid var(--hero-btn-line);color:var(--hero-btn-text);
  font-size:13px;font-weight:500;padding:7px 12px;border-radius:6px;
}
.btn-refresh:active{opacity:.65}
.btn-refresh.loading{opacity:.7}
.spin{width:12px;height:12px;border:1.6px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:none}
.btn-refresh.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.hero-note{margin-top:13px;font-size:13px;color:#8a8a8a}

/* ---------- 分类标签 ---------- */
.tabs{
  position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:20;
  display:flex;gap:8px;overflow-x:auto;
  padding:12px 14px;background:var(--bg);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  background:var(--pill);border:1px solid var(--pill-line);
  font-size:14px;font-weight:500;color:var(--pill-text);
  transition:background .15s,color .15s,border-color .15s;
}
.tab .num{font-size:12.5px;color:var(--pill-num);font-weight:400}
.tab.on{background:var(--active);border-color:var(--active);color:var(--active-text)}
.tab.on .num{color:rgba(255,255,255,.72)}
[data-theme="dark"] .tab.on .num{color:rgba(0,0,0,.55)}

/* ---------- 列表 ---------- */
.list{padding:0 12px calc(36px + env(safe-area-inset-bottom))}
.section-label{color:var(--red-dark);font-size:13px;font-weight:600;padding:0 4px 8px}
.card{
  position:relative;background:var(--card);border-radius:12px;
  padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow);
  animation:cardIn .22s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card.hot{border-left:3px solid var(--red);padding-left:13px}
.card .meta{display:flex;align-items:center;gap:8px;font-size:13px}
.cat-chip{font-size:13px;font-weight:600;color:var(--text);padding:0;background:none}
.card .time{font-size:13px;color:var(--text3);font-weight:400}
.card h2{
  margin:7px 0 8px;font-size:19px;line-height:1.45;font-weight:700;
  letter-spacing:.1px;color:var(--text);
}
.card .summary{margin:0;font-size:15px;line-height:1.62;color:var(--text2)}
.impact{margin-top:11px;background:var(--impact);border-radius:8px;padding:10px 12px}
.impact-t{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.impact-row{display:flex;font-size:13.5px;line-height:1.55;margin-top:2px}
.impact-row .tag{flex:0 0 auto;font-weight:600}
.impact-row .tag.good,.impact-row .tag.bad{color:var(--red-dark)}
.impact-row .val{color:var(--text2);flex:1 1 auto}
.impact-row .val.muted{color:var(--text3)}
.src{margin-top:10px;font-size:12.5px;color:var(--text3)}
.empty{padding:60px 20px;text-align:center;color:var(--text3)}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px}
.empty .e1{font-size:15px;color:var(--text2);font-weight:500}
.empty .e2{font-size:13px;margin-top:6px}

/* ---------- 详情页 ---------- */
.detail{
  position:fixed;inset:0;z-index:60;display:flex;justify-content:center;
  background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .22s;
}
.detail.open{opacity:1;pointer-events:auto}
.detail-inner{
  width:100%;max-width:480px;height:100%;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.detail.open .detail-inner{transform:none}
.dhead{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:0 8px;padding-top:env(safe-area-inset-top);
  height:calc(50px + env(safe-area-inset-top));
  background:var(--nav);border-bottom:1px solid var(--line);
}
.dhead .t{flex:1 1 auto;text-align:center;font-size:15px;font-weight:600}
.dbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px calc(40px + env(safe-area-inset-bottom))}
.dbody .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text3)}
.dbody .meta b{color:var(--text);font-size:13px;font-weight:600}
.dbody h1{margin:10px 0 16px;font-size:25px;line-height:1.4;font-weight:700;letter-spacing:.2px}
.dbody p{margin:0 0 15px;font-size:16.5px;line-height:1.78;color:var(--text2)}
.dbody .impact{margin:18px 0 0;padding:13px 14px}
.dbody .impact-t{font-size:13.5px;margin-bottom:7px}
.dbody .impact-row{font-size:14px;line-height:1.65}
.dbody .src{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px}
.star-on{color:#f5a623}

/* ---------- 底部弹层 ---------- */
.mask{
  position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .2s;
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:480px;background:var(--card);
  border-radius:16px 16px 0 0;padding:6px 0 calc(10px + env(safe-area-inset-bottom));
  max-height:80vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.mask.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.sheet-h .st{font-size:16px;font-weight:700}
.sheet-h .sc{font-size:14px;color:var(--text3)}
.sheet-item{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:15.5px}
.sheet-item:active{background:var(--impact)}
.sheet-item .ic{width:22px;height:22px;color:var(--text2);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.sheet-item .ic svg{width:20px;height:20px}
.sheet-item .tx{flex:1 1 auto;min-width:0}
.sheet-item .tx .s1{font-size:15px;color:var(--text)}
.sheet-item .tx .s2{font-size:12.5px;color:var(--text3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-item .ck{color:var(--red);font-size:14px;font-weight:600}
.sheet-sep{height:1px;background:var(--line);margin:6px 18px}
.mk-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:15px}
.mk-row .v{font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:14.5px}
.mk-row .v.up{color:#e5372c}
.mk-row .v.dn{color:#12a05c}

/* ---------- 其它 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:rgba(22,22,22,.94);color:#fff;font-size:13.5px;
  padding:10px 16px;border-radius:10px;z-index:95;max-width:82vw;text-align:center;
  transition:opacity .22s,transform .22s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ptr{
  position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;z-index:40;
  width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;pointer-events:none;
}
.ptr svg{width:15px;height:15px;color:var(--text3);transition:transform .1s}
.ptr .spin2{
  width:14px;height:14px;border:1.7px solid var(--text3);border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;display:none;
}
</style>
</head>

<div id="app">

      </button>
      <button class="icon-btn" id="shareBtn" aria-label="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-top">
      <h1 class="brand">全球<em>要闻</em></h1>
      <div class="hdate">
        <div id="dateMain">2026年11月12日</div>
        <div id="dateWeek">星期四</div>
      </div>
    </div>
    <div class="hero-row">
      <div class="upd"><i></i><span id="updTime">更新于 06:40（3 小时前）</span></div>
      <button class="btn-refresh" id="refreshBtn">
        <span class="spin"></span><span id="refreshTx">立即更新</span>
      </button>
    </div>
    <div class="hero-note" id="updNote">已更新到最新新闻。</div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <div class="list" id="list"></div>
</div>

<div class="detail" id="detail">
  <div class="detail-inner">
    <div class="dhead">
      <button class="icon-btn" id="dBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div class="t" id="dHeadTitle">要闻详情</div>
      <button class="icon-btn" id="dStar" aria-label="收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/>
        </svg>
      </button>
      <button class="icon-btn" id="dShare" aria-label="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.2v11.2"/><path d="m8 6.9 4-3.7 4 3.7"/>
          <path d="M5.5 12.6v6.3A1.6 1.6 0 0 0 7.1 20.5h9.8a1.6 1.6 0 0 0 1.6-1.6v-6.3"/>
        </svg>
      </button>
    </div>
    <div class="dbody" id="dBody"></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<div class="ptr" id="ptr">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>
  <span class="spin2"></span>
</div>

<div class="toast" id="toast"></div>

/* ===================== 主题 ===================== */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'dark' ? '#181b21' : '#ffffff');
  try{ localStorage.setItem('gn_theme', t); }catch(e){}
}
(function initTheme(){
  let t = 'light';
  try{ t = localStorage.getItem('gn_theme') || 'light'; }catch(e){}
  applyTheme(t);
})();
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  toast(cur === 'dark' ? '已切换到浅色模式' : '已切换到深色模式');
});

/* ===================== 收藏 ===================== */
let favs = [];

function saveFavs(){ try{ localStorage.setItem('gn_favs', JSON.stringify(favs)); }catch(e){} }

/* ===================== 日期 ===================== */
(function initDate(){
  const d = new Date();
  $('dateMain').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  $('dateWeek').textContent = WEEK[d.getDay()];
})();

/* ===================== 渲染 ===================== */
function renderTabs(){
  tabsEl.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab' + (state.tab === t.key ? ' on' : '');
    b.innerHTML = '<span>' + t.key + '</span><span class="num">' + t.count + '</span>';
    b.addEventListener('click', () => {
      state.tab = t.key;
      renderTabs();
      renderList(true);
    });
    tabsEl.appendChild(b);
  });
}

function getFiltered(){
  return state.articles.filter(a => {
    const okTab = state.tab === '全部' || a.cat === state.tab;
    const okCh  = state.channel === '全球要闻' || a.channel === state.channel;
    return okTab && okCh;
  });
}

function impactHTML(a){
  let h = '';
  if(a.good && a.good.length){
    h += '<div class="impact-row"><span class="tag good">利好：</span><span class="val">' + a.good.join('、') + '</span></div>';
  }
  if(a.bad && a.bad.length){
    h += '<div class="impact-row"><span class="tag bad">利空：</span><span class="val">' + a.bad.join('、') + '</span></div>';
  }
  if(a.note){
    h += '<div class="impact-row"><span class="val muted">' + a.note + '</span></div>';
  }
  if(!h) return '';
  return '<div class="impact"><div class="impact-t">对股市可能的影响</div>' + h + '</div>';
}

function renderList(animate){
  const items = getFiltered();
  listEl.innerHTML = '';

  if(!items.length){
    listEl.innerHTML =

        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>' +
        '<div class="e1">暂无相关新闻</div>' +
        '<div class="e2">' + (state.tab === '个股' ? '当前追踪的个股暂无新消息' : '该频道今日暂无更新') + '</div>' +
      '</div>';
    return;
  }

  if(state.tab === '全部' && state.channel === '全球要闻'){
    const lb = document.createElement('div');
    lb.className = 'section-label';
    lb.textContent = '头条';
    listEl.appendChild(lb);
  }

  items.forEach((a, idx) => {
    const card = document.createElement('article');
    card.className = 'card' + (a.hot && idx === 0 && state.tab === '全部' && state.channel === '全球要闻' ? ' hot' : '');
    card.innerHTML =
      '<div class="meta"><button class="cat-chip">' + a.cat + '</button>' +
        '<span class="time">' + a.time + '</span></div>' +
      '<h2>' + a.title + '</h2>' +
      '<p class="summary">' + a.body + '</p>' +
      impactHTML(a) +
      '<div class="src">来源：' + a.source + '</div>';

    card.querySelector('.cat-chip').addEventListener('click', (ev) => {
      ev.stopPropagation();
      const t = TABS.find(x => x.key === a.cat);
      if(t){ state.tab = t.key; renderTabs(); renderList(true); toast('已筛选：' + a.cat); }
    });
    card.addEventListener('click', () => openDetail(a.id));
    listEl.appendChild(card);
  });
  if(animate) window.scrollTo({top:0, behavior:'auto'});
}

/* ===================== 详情 ===================== */
function openDetail(id){
  const a = state.articles.find(x => x.id === id);
  if(!a) return;
  currentArticle = a;
  $('dHeadTitle').textContent = a.cat + ' · 要闻';
  const fav = favs.indexOf(a.id) >= 0;
  const starBtn = $('dStar');
  starBtn.classList.toggle('star-on', fav);
  starBtn.querySelector('svg').setAttribute('fill', fav ? 'currentColor' : 'none');

  const paras = a.body.split('\n').filter(Boolean).map(p => '<p>' + p + '</p>').join('');
  dBody.innerHTML =
    '<div class="meta"><b>' + a.cat + '</b><span>' + a.time + '</span><span>·</span><span>来源：' + a.source + '</span></div>' +
    '<h1>' + a.title + '</h1>' +
    paras +
    impactHTML(a) +
    '<div class="src">本文由「全球要闻」根据公开信息整理，仅供参考，不构成投资建议。</div>';

  dBody.scrollTop = 0;
  detailEl.classList.add('open');
  detailOpen = true;
  document.body.style.overflow = 'hidden';
  history.pushState({detail:id}, '');
}

function closeDetail(fromPop){
  detailEl.classList.remove('open');
  detailOpen = false;
  document.body.style.overflow = '';
  if(!fromPop) history.back();
}
window.addEventListener('popstate', () => {
  if(detailOpen) closeDetail(true);
});

$('dBack').addEventListener('click', () => closeDetail(false));
$('dStar').addEventListener('click', () => {
  if(!currentArticle) return;
  const i = favs.indexOf(currentArticle.id);
  if(i >= 0){ favs.splice(i, 1); toast('已取消收藏'); }
  else { favs.push(currentArticle.id); toast('已加入收藏'); }
  saveFavs();
  const on = favs.indexOf(currentArticle.id) >= 0;
  $('dStar').classList.toggle('star-on', on);
  $('dStar').querySelector('svg').setAttribute('fill', on ? 'currentColor' : 'none');
});

function shareArticle(a){
  if(!a) return;
  const text = a.title + '\n—— 全球要闻';
  if(navigator.share){
    navigator.share({title:a.title, text:text}).catch(() => {});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => toast('标题已复制，可粘贴分享')).catch(() => toast('长按标题可复制'));
  }else{
    toast('长按标题即可复制分享');
  }
}

/* ===================== 更新 ===================== */
function nowHM(){
  const d = new Date();
  const p = (n) => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

function doRefresh(){
  if(state.refreshing) return;
  state.refreshing = true;
  const btn = $('refreshBtn');
  btn.classList.add('loading');
  $('refreshTx').textContent = '更新中…';

  setTimeout(() => {
    state.refreshes++;
    $('updTime').textContent = '更新于 ' + nowHM() + '（刚刚）';
    $('updNote').textContent = '已更新到最新新闻。';

    if(state.refreshes === 1 && !state.articles.some(a => a.id === ARTICLE_NEW.id)){
      state.articles.unshift(ARTICLE_NEW);
      toast('已同步至最新 · 新增 1 条要闻');
    }else{
      toast('已是最新，暂无新增要闻');
    }

    btn.classList.remove('loading');
    $('refreshTx').textContent = '立即更新';
    state.refreshing = false;
    renderList(false);
  }, 900);
}
$('refreshBtn').addEventListener('click', doRefresh);

/* ===================== 下拉刷新 ===================== */
let pullStart = 0, pulling = false, pullDist = 0, ptrBusy = false;
const ptrEl = $('ptr');
const ptrIcon = ptrEl.querySelector('svg');
const ptrSpin = ptrEl.querySelector('.spin2');

function setPtr(d){
  pullDist = d;
  if(d <= 0){
    ptrEl.style.opacity = '0';
    ptrIcon.style.transform = 'rotate(0deg)';
    return;
  }
  ptrEl.style.opacity = '1';
  ptrIcon.style.display = 'block';
  ptrSpin.style.display = 'none';
  ptrIcon.style.transform = 'rotate(' + (d >= 60 ? 180 : (d / 60) * 180) + 'deg)';
}

document.addEventListener('touchstart', (e) => {
  if(ptrBusy || detailOpen || state.refreshing) return;
  if(window.scrollY <= 0 && !maskEl.classList.contains('on')){
    pullStart = e.touches[0].clientY;
    pulling = true;
    setPtr(0);
  }
}, {passive:true});

document.addEventListener('touchmove', (e) => {
  if(!pulling) return;
  const dy = e.touches[0].clientY - pullStart;
  if(dy <= 0){ pulling = false; setPtr(0); return; }
  setPtr(Math.min(dy * 0.55, 80));
  if(e.cancelable) e.preventDefault();
}, {passive:false});

document.addEventListener('touchend', () => {
  if(!pulling) return;
  pulling = false;
  const d = pullDist;
  if(d >= 58){
    ptrBusy = true;
    ptrIcon.style.display = 'none';
    ptrSpin.style.display = 'block';
    ptrEl.style.opacity = '1';
    doRefresh();
    setTimeout(() => {
      ptrBusy = false;
      ptrEl.style.opacity = '0';
      ptrSpin.style.display = 'none';
      ptrIcon.style.display = 'block';
    }, 700);
  }else{
    setPtr(0);
  }
});

let toastTimer = null;
function toast(msg){

  toastEl.classList.add('on');

  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1900);
}

/* Service Worker（仅 https / localhost 生效，用于离线打开） */
